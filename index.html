<script>
const lessonData = {
  "courseTitle": "Хидроакустика",
  "courseSub": "Основни физически понятия",
  "learningOutcomes": [
    "Да се обяснят понятията налягане, вълнов процес,"
  ],
  "slides": [
    {
      "id": "s1",
      "type": "content",
      "title": "Нека първо представим няколко основни понятия",
      "useDropcap": true,
      "text": "Нека си представим цилиндрично бутало и камера с въздух и газ (лявата фигура). Нека поставим тежест върху буталото. Какво ще се случи с газа? От силата на тежестта буталото ще потъне и ще свие газа, с това налягането на газа ще нарасне. Буталото ще спре в положение, при което натискът на тежестта отгоре ще се уравновеси с натиска от страна на газа върху буталото нагоре (дясна фигура).\n<br>\nНека си представим още едно бутало, но с по-голяма площ и два пъти по-голяма тежест върху него. Колко по-голямата трябва да бъде площта на буталото, за да се получи еднакво с първия случай налягане?\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/piston_gas_pressure.png\" target=\"_blank\">\n    <img src=\"images/piston_gas_pressure.png\" alt=\"Piston pressing against a gas in a chamber\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Piston pressing against a gas in a chamber (click to enlarge)<\/div>\n<\/div>",
      "bullets": []
    },
    {
      "id": "s2",
      "type": "content",
      "title": "Налягане и площ",
      "useDropcap": false,
      "text": "Налягането е силата, отнесена към площта, върху която тя действа: p = F / A. Ако площта на буталото е два пъти по-голяма и също силата разпределена върху него е също толкова по-голяма, налягането е еднакво с първия случай. Тук определяща е силата действаща перпендикулярно на повърхността на буталото. \n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/piston_gas_pressure2.png\" target=\"_blank\">\n    <img src=\"images/piston_gas_pressure2.png\" alt=\"Twice the surface and twice the force does not change the pressure\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Twice the surface and twice the force does not change the pressure (click to enlarge)<\/div>\n<\/div>",
      "bullets": []
    },
    {
      "id": "q1",
      "type": "quiz",
      "title": "Проверка на разбирането",
      "question": "Ако площта на буталото се удвои, каква сила е необходима за същото налягане?",
      "options": [
        "Два пъти по-малка",
        "Същата",
        "Два пъти по-голяма"
      ],
      "correctIndex": 2,
      "explanation": "От p = F/A следва F = pA."
    },
    {
      "id": "s_hlexej1e",
      "type": "content",
      "title": "Какво е вълна? (откъс от А. Айнщайн)",
      "text": "КАКВО Е ВЪЛНА?\nЕдна клюка, тръгнала от Лондон, достига до Единбург много бързо, въпреки че нито един от хората, които участват в разпространяването ѝ, не пътува между тези два града. Тук са налице два съвсем различни вида движение: движението на слуха от Лондон до Единбург и движението на хората, които разпространяват слуха.\n\nВятърът, преминавайки над житно поле, поражда вълна, която се разпространява през цялото поле. И тук трябва да разграничим движението на вълната от движението на отделните житни стъбла, които извършват само малки колебания.\n\nВсички сме виждали как вълните се разпространяват във все по-широки концентрични кръгове, когато хвърлим камък във воден басейн. Движението на вълната е съвсем различно от движението на водните частици. Частиците просто се движат нагоре и надолу. Наблюдаваното движение на вълната е движение на определено състояние на материята, а не движение на самата материя.\n\nТова ясно се вижда, ако наблюдаваме коркова тапа, плаваща върху вълната. Тя се движи нагоре и надолу, следвайки действителното движение на водата, вместо да бъде пренасяна заедно с вълната.\n\nЗа да разберем по-добре механизма на вълната, нека отново разгледаме един идеализиран експеримент.\n\nДа предположим, че голямо пространство е запълнено равномерно с вода, въздух или някаква друга „среда“. Някъде в центъра се намира сфера. В началото на експеримента няма никакво движение.\n\nИзведнъж сферата започва ритмично да „диша“, като се разширява и свива по обем, но запазва сферичната си форма.\n\nКакво ще се случи в средата?\n\nНека започнем разглеждането от момента, в който сферата започва да се разширява. Частиците на средата в непосредствена близост до сферата се изтласкват навън, така че плътността на сферичен слой от вода, въздух или каквато и да е друга среда се увеличава над нормалната си стойност.\n\nПо подобен начин, когато сферата се свива, плътността на онази част от средата, която непосредствено я заобикаля, ще намалее. Тези изменения на плътността се разпространяват през цялата среда. Частиците, изграждащи средата, извършват само малки колебания, но цялостното движение представлява разпространяваща се вълна. Съществено новото тук е, че за първи път разглеждаме движението не на материя, а на енергия, която се разпространява през материята.\n\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/wave_types.png\" target=\"_blank\">\n    <img src=\"images/wave_types.png\" alt=\"Wave types\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Wave types (click to enlarge)<\/div>\n<\/div>\n\n\nИзползвайки примера с пулсиращата сфера, можем да въведем две общи физични понятия, важни за описанието на вълните.\n\nПървото е скоростта, с която се разпространява вълната. Тя зависи от средата, като например е различна във вода и във въздух.\n\nВторото понятие е дължина на вълната. При вълните в морето или реката това е разстоянието от падината на една вълна до падината на следващата или от гребена на една вълна до гребена на следващата. Следователно морските вълни имат по-голяма дължина на вълната от речните.\n\nПри вълните, породени от пулсираща сфера, дължината на вълната е разстоянието в определен момент между две съседни сферични обвивки, в които плътността достига максимални или минимални стойности.\n\nОчевидно е, че това разстояние не зависи от средата. Скоростта на пулсациите на сферата обаче със сигурност оказва голямо влияние — дължината на вълната става по-малка, ако пулсациите се ускорят, и по-голяма, ако се забавят.\n\nТова понятие за вълна се оказва изключително успешно във физиката. То несъмнено е механично понятие. Явлението се свежда до движението на частици, които според кинетичната теория са съставните елементи на материята.\n\nСледователно всяка теория, която използва понятието за вълна, може по принцип да бъде разглеждана като механична теория.\n\nНапример обяснението на акустичните явления се основава предимно на това понятие. Вибриращи тела, като гласните струни и струните на цигулката, са източници на звукови вълни, които се разпространяват във въздуха по начина, обяснен чрез примера с пулсиращата сфера.\n\nПо този начин е възможно всички акустични явления да бъдат сведени до механиката посредством понятието за вълна.\n\nКакто вече беше подчертано, трябва да правим разлика между движението на частиците и движението на самата вълна, която представлява определено състояние на средата. Тези две движения са съвсем различни, но очевидно в нашия пример с пулсиращата сфера и двете се извършват по една и съща права линия.\n\nЧастиците на средата извършват колебания по къси праволинейни отсечки, а плътността периодично се увеличава и намалява в съответствие с това движение.\n\nПосоката, в която се разпространява вълната, и правата, по която се извършват колебанията, съвпадат. Този вид вълна се нарича надлъжна вълна.\n\nНо дали това е единственият вид вълна? За по-нататъшните ни разсъждения е важно да осъзнаем възможността за съществуването на друг вид вълна, наречена напречна вълна.\n\nНека изменим предишния си пример. Все още имаме сфера, но сега тя е потопена в среда от различен вид — нещо като желе вместо въздух или вода.\n\nОсвен това сферата вече не пулсира, а се завърта в една посока на малък ъгъл, след което се връща обратно винаги по един и същ ритмичен начин и около определена ос. Желеобразната среда прилепва към сферата и поради това прилепналите към нея части са принудени да следват движението ѝ. Тези части на свой ред принуждават разположените малко по-далеч части на средата да извършват същото движение и така нататък, в резултат на което в средата възниква вълна.\n\nАко имаме предвид разграничението между движението на средата и движението на вълната, ще видим, че в този случай те не се извършват по една и съща права линия.\n\nВълната се разпространява в посока по радиуса на сферата, докато частите на средата се движат перпендикулярно на тази посока. По този начин сме създали напречна вълна.\n\nВълните, разпространяващи се по повърхността на водата, са напречни. Плаваща коркова тапа се движи нагоре и надолу, докато вълната се разпространява в хоризонтална равнина. Звуковите вълни, от друга страна, представляват най-познатия пример за надлъжни вълни.\n\nОще една забележка: вълната, породена от пулсираща или колебаеща се сфера в еднородна среда, е сферична вълна. Тя се нарича така, защото във всеки даден момент всички точки върху сфера, обкръжаваща източника, се движат по един и същ начин.\n\nНека разгледаме част от такава сфера, намираща се на голямо разстояние от източника. Колкото по-далеч е тази част и колкото по-малка я изберем, толкова повече тя прилича на равнина.\n\nСледователно можем да кажем, без да бъдем прекалено строги в изискванията си за точност, че няма съществена разлика между част от равнина и част от сфера, чийто радиус е достатъчно голям.\n\nМного често говорим за малки участъци от сферична вълна, които са достатъчно отдалечени от източника, като за плоски вълни.\n\nКолкото по-далеч от центъра на сферите разположим защрихованата част от нашата рисунка и колкото по-малък е ъгълът между двата радиуса, толкова по-добре тя може да бъде представена като плоска вълна.\n\nПонятието за плоска вълна, подобно на много други физични понятия, не е нищо повече от идеализация, която може да бъде реализирана само с определена степен на точност.\n\nВъпреки това то е полезно понятие, което ще ни бъде необходимо по-нататък.\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/longitudinal wave.png\" target=\"_blank\">\n    <img src=\"images/longitudinal wave.png\" alt=\"A longitudinal wave\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">A longitudinal wave (click to enlarge)<\/div>\n<\/div>\n\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/mexican_wave.png\" target=\"_blank\">\n    <img src=\"images/mexican_wave.png\" alt=\"A Mexican wave\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">A Mexican wave (click to enlarge)<\/div>\n<\/div>\n\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/plane_wave.png\" target=\"_blank\">\n    <img src=\"images/plane_wave.png\" alt=\"A plane wave\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">A plane wave (click to enlarge)<\/div>\n<\/div>\n\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/sine_wave.png\" target=\"_blank\">\n    <img src=\"images/sine_wave.png\" alt=\"A sine wave\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">A sine wave (click to enlarge)<\/div>\n<\/div>\n\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/canceling_wave.png\" target=\"_blank\">\n    <img src=\"images/canceling_wave.png\" alt=\"Canceling a wave\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Canceling a wave (click to enlarge)<\/div>\n<\/div>\n\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/reinforcing_wave.png\" target=\"_blank\">\n    <img src=\"images/reinforcing_wave.png\" alt=\"Reinforcing a wave\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Reinforcing a wave (click to enlarge)<\/div>\n<\/div>\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/interference.png\" target=\"_blank\">\n    <img src=\"images/interference.png\" alt=\"Wave interference\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Wave interference (click to enlarge)<\/div>\n<\/div>\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/Active_Noise_Cancelling.png\" target=\"_blank\">\n    <img src=\"images/Active_Noise_Cancelling.png\" alt=\"Noise cancellation\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Noise cancellation (click to enlarge)<\/div>\n<\/div>\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/wave1.png\" target=\"_blank\">\n    <img src=\"images/wave1.png\" alt=\"Image\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n<\/div>\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/wave2.png\" target=\"_blank\">\n    <img src=\"images/wave2.png\" alt=\"Image\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n<\/div>\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/wave3.png\" target=\"_blank\">\n    <img src=\"images/wave3.png\" alt=\"Image\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n<\/div>\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/wave4.png\" target=\"_blank\">\n    <img src=\"images/wave4.png\" alt=\"Image\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:point let state = { idx:0, quiz:{} };
const $ = (sel) => document.querySelector(sel);
function escapeHtml(str){ return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;").replace(/'/g, "&#39;"); }
function paragraphsFromText(text){ return String(text || "").split(/\n\s*\n/).map(s => s.trim()).filter(Boolean); }
function renderContent(sl){ const rawText = String(sl.text || ""); const containsHtml = /<[^>]+>/.test(rawText); let pHtml = ""; if(containsHtml){ pHtml = rawText; } else { paragraphsFromText(rawText).forEach((p,i)=>{ const cls = i===0 ? (sl.useDropcap ? "lead dropcap" : "lead") : ""; pHtml += "<p class=\""+cls+"\">" + escapeHtml(p) + "</p>"; }); } if(!pHtml){ pHtml = "<p class=\"lead dropcap\">Add slide text in the editor.</p>"; } let ul = ""; if((sl.bullets||[]).length){ ul = "<ul>"; sl.bullets.forEach(b=> ul += "<li>"+escapeHtml(b)+"</li>"); ul += "</ul>"; } return "<div class=\"h1\">"+escapeHtml(sl.title)+"</div><div class=\"book\">"+pHtml+ul+"</div>"; }
function renderQuiz(sl){ const prev = state.quiz[sl.id]; const chosen = prev && typeof prev.selectedIndex === "number" ? prev.selectedIndex : null; const answered = !!prev; let opts = ""; sl.options.forEach((txt,i)=>{ let cls = "qOpt"; if(answered){ if(i===sl.correctIndex) cls += " correct"; else if(i===chosen) cls += " wrong"; } opts += "<button class=\""+cls+"\" data-i=\""+i+"\" type=\"button\">"+escapeHtml(txt)+"</button>"; }); const fb = answered ? "<div class=\"qFeedback\">" + (prev.isCorrect ? "✅ Correct. " : "❌ Not quite. ") + escapeHtml(sl.explanation || "") + "</div>" : ""; return "<div class=\"quizBox\"><div class=\"qTitle\">"+escapeHtml(sl.title)+"</div><p class=\"qPrompt\">"+escapeHtml(sl.question||"")+"</p><div class=\"qOptions\">"+opts+"</div>"+fb+"</div>"; }
function wireQuiz(sl){ document.querySelectorAll(".qOpt").forEach(btn => { btn.onclick = () => { const i = Number(btn.getAttribute("data-i")); state.quiz[sl.id] = { selectedIndex:i, isCorrect:i === sl.correctIndex }; render(); }; }); }
function render(){ $("#courseTitle").textContent = lessonData.courseTitle; $("#courseSub").textContent = lessonData.courseSub; const goals = $("#goals"); goals.innerHTML = ""; (lessonData.learningOutcomes || []).forEach(g => { const li = document.createElement("li"); li.textContent = g; goals.appendChild(li); }); state.idx = Math.max(0, Math.min(state.idx, lessonData.slides.length - 1)); $("#slideCounter").textContent = (state.idx + 1) + " / " + lessonData.slides.length; $("#progressFill").style.width = (((state.idx + 1)/lessonData.slides.length) * 100) + "%"; const sl = lessonData.slides[state.idx]; $("#slide").innerHTML = sl.type === "quiz" ? renderQuiz(sl) : renderContent(sl); $("#statusLine").textContent = sl.type === "quiz" ? "Quick Check" : "Reading slide"; $("#btnPrev").disabled = state.idx === 0; $("#btnNext").disabled = state.idx === lessonData.slides.length - 1; if(sl.type === "quiz") wireQuiz(sl); }
$("#btnPrev").onclick = () => { state.idx = Math.max(0, state.idx - 1); render(); };
$("#btnNext").onclick = () => { state.idx = Math.min(lessonData.slides.length - 1, state.idx + 1); render(); };
document.addEventListener("keydown", (e) => { if(e.key === "ArrowLeft"){ state.idx = Math.max(0, state.idx - 1); render(); } else if(e.key === "ArrowRight"){ state.idx = Math.min(lessonData.slides.length - 1, state.idx + 1); render(); } });
render();
</script>
